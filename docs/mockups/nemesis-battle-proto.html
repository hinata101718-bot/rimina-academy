<title>宿敵戦の試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
/* 夜の戦場：暗い土と草のマス目に、生成りの札。宿敵は赤と金。暗い一色の世界 */
:root{
  --bg:#150e09; --panel:#120b07; --paper:#f3e7cc; --ink:#2a1d14; --mute:#8a7a68; --text:#f1e3c2; --soft:#cdb98e;
  --brass:#d9b45a; --red:#c0392b; --blue:#4a86d4; --green:#5fb35f; --line:#8b6a3a; --grass:#3f5130; --grass2:#475a36; --forest:#2c3f24; --rock:#5a5148;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px 20px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;position:relative}
h1,h2{font-family:var(--serif);font-weight:900;margin:0;color:var(--brass)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid #ffd34a;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:17px}
.pill{background:linear-gradient(#e2c06a,#a87d2a);color:var(--ink);font-weight:900;border-radius:5px;padding:2px 9px;font-size:12px;white-space:nowrap}
/* 宿敵の札 */
.boss{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#3a0f0a,#1b0c08);border:2px solid #e0b24a;border-radius:10px;padding:8px}
.boss .face{width:64px;height:64px;border-radius:8px;background-size:cover;background-position:50% 18%;border:2px solid #e0b24a;flex:none}
.boss .bt{flex:1;min-width:0}
.boss .nm{font-family:var(--serif);font-weight:900;font-size:16px;color:#ffd27a}
.hp{height:7px;background:#3a2a1e;border-radius:4px;overflow:hidden;margin:3px 0}.hp i{display:block;height:100%;background:#d0503f;transition:width .35s}
.shields{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--soft)}
.sh{width:14px;height:16px;background:linear-gradient(#9fc3ff,#4a6fb0);clip-path:polygon(50% 0,100% 20%,100% 60%,50% 100%,0 60%,0 20%);display:inline-block}
.sh.off{background:#3a2a1e}
.weak{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.wk{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:#f3e7cc;color:var(--ink)}
.wk.q{background:#3a2a1e;color:var(--soft);border:1px dashed var(--soft)}
.wk.no{background:#3a2a1e;color:#ff9a8a;text-decoration:line-through}
.broke{color:#ffd27a;font-weight:900;font-size:12px}
/* 盤 */
.board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:#0c0805;padding:2px;border-radius:8px;border:2px solid var(--line);touch-action:manipulation}
.cell{position:relative;aspect-ratio:1/1;border-radius:4px;background:var(--grass);display:flex;align-items:center;justify-content:center;overflow:visible;cursor:pointer;border:0;padding:0}
.cell:nth-child(odd){background:var(--grass2)}
.cell.forest{background:var(--forest)}
.cell.forest::before{content:"";position:absolute;inset:18%;background:radial-gradient(circle at 30% 35%,#4f6f3c 0 22%,transparent 23%),radial-gradient(circle at 70% 40%,#4a6838 0 22%,transparent 23%),radial-gradient(circle at 50% 72%,#557a42 0 24%,transparent 25%);opacity:.9}
.cell.rock{background:var(--rock);cursor:default}
.cell.rock::before{content:"";position:absolute;inset:20%;background:#7a6e60;clip-path:polygon(20% 80%,35% 30%,55% 15%,80% 40%,85% 80%);}
.cell.move::after{content:"";position:absolute;inset:3px;border-radius:4px;background:rgba(74,134,212,.45);box-shadow:inset 0 0 0 2px #8fb8ff}
.cell.tgt::after{content:"";position:absolute;inset:3px;border-radius:4px;background:rgba(192,57,43,.35);box-shadow:inset 0 0 0 2px #ff8a7a;animation:pulse 1s infinite}
.cell.ally::after{content:"";position:absolute;inset:3px;border-radius:4px;background:rgba(95,179,95,.35);box-shadow:inset 0 0 0 2px #9be29b}
@keyframes pulse{50%{opacity:.5}}
.u{position:absolute;inset:3px;border-radius:6px;background-size:cover;background-position:50% 18%;border:2px solid var(--blue);z-index:2;transition:transform .2s}
.u.foe{border-color:var(--red)}
.u.boss{border-color:#ffd27a;box-shadow:0 0 10px #e0b24a}
.u.grunt{background:#3a1410;display:flex;align-items:center;justify-content:center;font:900 15px var(--serif);color:#ffd0c0}
.u.done{filter:grayscale(.75) brightness(.7)}
.u.sel{box-shadow:0 0 0 3px #ffd34a,0 0 14px #ffd34a}
.u.broken{box-shadow:0 0 0 3px #ffd27a;animation:wob .8s infinite}
@keyframes wob{50%{transform:rotate(-4deg)}}
.u .b{position:absolute;left:-2px;right:-2px;bottom:-4px;height:5px;background:#000a;border-radius:3px;overflow:hidden}
.u .b i{display:block;height:100%;background:var(--green)}
.u.foe .b i{background:#e0503f}
.u .ss{position:absolute;top:-6px;left:-4px;display:flex;gap:1px}
.u .ss .sh{width:9px;height:10px}
.inc{position:absolute;top:-8px;right:-6px;z-index:4;background:#c0392b;color:#fff;font:900 11px var(--sans);border-radius:8px;padding:0 5px;border:1px solid #ffb0a0}
.aim{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);z-index:4;background:#000c;color:#ffb0a0;font:700 9px var(--sans);border-radius:6px;padding:0 4px;white-space:nowrap}
.aim.rage{color:#ffd27a;background:#5a0f08}
.aim.ap{color:var(--soft)}
.pop{position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:9;font:900 20px var(--sans);color:#fff;text-shadow:0 0 3px #a3281e,0 0 3px #a3281e,0 2px 0 #5a120c;pointer-events:none;animation:popup .8s forwards;white-space:nowrap}
.pop.heal{text-shadow:0 0 3px #1f6b3a,0 0 3px #1f6b3a}
.pop.sh{font-size:13px;color:#cfe2ff;text-shadow:0 0 3px #1b3a70,0 0 3px #1b3a70}
.pop.no{font-size:13px;color:#ffb0a0}
@keyframes popup{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.slash{position:absolute;inset:-6px;z-index:8;pointer-events:none;background:linear-gradient(135deg,transparent 44%,#fff 48%,#fff6c0 50%,transparent 56%);animation:sl .3s forwards}
@keyframes sl{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0 0 0 0);opacity:0}}
.shake{animation:shk .3s}
@keyframes shk{20%{transform:translate(-4px,1px)}40%{transform:translate(4px,-1px)}60%{transform:translate(-3px,0)}80%{transform:translate(2px,0)}}
.bshake{animation:bshk .45s}
@keyframes bshk{10%{transform:translate(-6px,2px)}30%{transform:translate(6px,-2px)}50%{transform:translate(-4px,1px)}70%{transform:translate(3px,0)}}
/* 下の札 */
.panel{background:var(--panel);border:2px solid #e9d6a8;border-radius:10px;padding:8px 10px;box-shadow:0 0 0 2px var(--panel)}
.msg{font-family:var(--serif);font-size:14px;min-height:2.9em;line-height:1.45}
.msg b{color:#ffd27a}.msg .r{color:#ff9a8a}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.act{flex:1 1 30%;min-height:46px;border-radius:8px;border:1px solid var(--line);background:#3a2a1e;font-weight:700;font-size:13px;padding:4px 6px;cursor:pointer;line-height:1.25}
.act small{display:block;font-weight:400;font-size:10.5px;color:var(--soft)}
.act.main{background:linear-gradient(#b8382a,#7a1f16);border-color:var(--brass);color:#fff3d6}
.act:disabled{opacity:.4}
.who{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--soft)}
.who .f{width:30px;height:30px;border-radius:6px;background-size:cover;background-position:50% 18%;border:2px solid var(--blue)}
.who b{color:var(--text);font-size:14px}
/* 演出 */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cutin{position:absolute;left:-10%;right:-10%;top:38%;height:130px;transform:skewY(-8deg);background:linear-gradient(90deg,#5a0f08,#b8382a 40%,#5a0f08);border-top:3px solid #ffd27a;border-bottom:3px solid #ffd27a;display:flex;align-items:center;gap:14px;padding-left:16%;animation:cut 1.3s forwards;overflow:hidden}
.cutin::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 14px,rgba(255,255,255,.08) 14px 16px)}
.cutin .cf{width:96px;height:96px;border-radius:10px;background-size:cover;background-position:50% 18%;border:3px solid #ffd27a;transform:skewY(8deg);flex:none}
.cutin .ct{transform:skewY(8deg);position:relative}
.cutin .ct b{display:block;font:900 30px var(--serif);color:#fff6d0;text-shadow:0 3px 0 #5a120c}
.cutin .ct span{font:700 14px var(--serif);color:#ffe0c0}
@keyframes cut{0%{transform:skewY(-8deg) translateX(100%)}15%{transform:skewY(-8deg) translateX(0)}80%{transform:skewY(-8deg) translateX(0);opacity:1}100%{transform:skewY(-8deg) translateX(-100%);opacity:0}}
.breakfx{position:absolute;font:900 54px var(--serif);color:#ffd27a;text-shadow:0 0 18px #ff8a3a,0 4px 0 #5a120c;animation:brk 1.1s forwards}
@keyframes brk{0%{transform:scale(2.4) rotate(-8deg);opacity:0}25%{transform:scale(1) rotate(-8deg);opacity:1}80%{opacity:1}100%{transform:scale(1.1) rotate(-8deg);opacity:0}}
.shard{position:absolute;width:14px;height:16px;background:linear-gradient(#cfe2ff,#4a6fb0);clip-path:polygon(50% 0,100% 30%,70% 100%,0 70%);animation:shard 1s forwards}
@keyframes shard{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
.modal{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.modal .box{width:100%;max-width:440px;background:var(--panel);border:2px solid var(--brass);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow:auto}
.say{display:flex;gap:10px;align-items:flex-start}
.say .f{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:50% 18%;border:2px solid #e0b24a;flex:none}
.say p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.75}
.say p b{color:#ffd27a}
.note{font-size:12.5px;color:var(--soft);line-height:1.7;border-left:3px solid var(--brass);padding-left:8px}
.big{min-height:50px;border-radius:8px;border:2px solid var(--brass);background:linear-gradient(#b8382a,#7a1f16);color:#fff3d6;font:900 16px var(--serif);cursor:pointer}
.verdict{font:900 30px var(--serif);color:#ffd27a;text-align:center}
.help{font-size:11.5px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="wrap">
  <div class="top"><h1>宿敵戦の試作</h1><span class="pill" id="turn">ターン1</span></div>
  <div class="boss" id="boss"></div>
  <div class="board" id="board"></div>
  <div class="panel"><div class="msg" id="msg"></div><div class="acts" id="acts"></div></div>
  <p class="help">運はありません。攻撃は必ず当たり、敵が次に狙う相手（赤い札）は前もって見えています。弱点を突くと盾（青いしるし）が割れ、盾が0になると「ブレイク」して大きな隙ができます。</p>
</div>
<div class="overlay" id="ov"></div>

  }
  // ブレイクの回復・ターン送り
  for(const f of foes()){ if(f.broken>0){ f.broken--; if(f.broken===0){ f.sh=f.shMax; } } }
  turn++; U.forEach(u=>u.acted=false); busy=false; intents(); render();
  const z=U.find(u=>u.id==='zara');
  say(z.alive?`<b>ターン${turn}</b>　赤い札は、敵が次に狙う子と、受ける傷の大きさ。${z.fleeing?'<span class="r">ザラが逃げようとしている！ 北の端に着く前に決着を</span>':''}`:`<b>ターン${turn}</b>`);
  checkEnd();
}
function checkEnd(){ if(ended) return; const z=U.find(u=>u.id==='zara'); if(!z.alive||!me().length) endBattle(); }
function endBattle(){
  if(ended) return; ended=true; busy=false; render();
  const z=U.find(u=>u.id==='zara'); const down=U.filter(u=>u.side==='me'&&!u.alive).map(u=>u.name);
  let v,txt;
  if(!z.alive){v='討ち取った';txt='長い因縁に、決着がついた。ザラの鉄腕の籠手が、戦利品として残った。'}
  else if(fled){v='逃げられた';txt='ザラは深い傷を負って逃げた。恨みを抱え、いつか強くなって戻ってくる……（宿敵の記録に「逃がした」と残る）'}
  else {v='退却';txt='全員が倒れ、退くしかなかった。ザラはこの勝利を手柄に、昇進するだろう。'}
  showModal(`<div class="verdict">${v}</div><p class="note">${txt}</p><p class="note">${turn}ターン　重傷：${down.length?down.join('、'):'なし'}</p>
   <p class="note">気づいたこと：盾を割ってブレイクさせないと、ザラは執念で1度だけ持ちこたえます。体力が4分の1を切ると、北の端へ逃げはじめます。</p>
   <button class="big" id="again">もう一度戦う</button>`,()=>{ $('again').onclick=()=>{closeModal();start()} });
}
function showModal(h,after){ let m=document.createElement('div'); m.className='modal'; m.id='modal'; m.innerHTML=`<div class="box">${h}</div>`; document.body.appendChild(m); after&&after() }
function closeModal(){ $('modal')?.remove() }
function start(){ init(); intents(); render(); say('<b>ターン1</b>　子をタップして動かし、攻撃する。全員が動いたら、敵の番です。') }
function intro(){
  init(); intents(); render(); say('');
  showModal(`<h2>宿敵戦　森の砦</h2>
   <div class="say"><div class="f" style="background-image:url(${face('zara')})"></div><p><b>鉄腕のザラ</b>「その顔……覚えているぞ、<b>カエ</b>。三年前の対抗戦で、私の腕を折った小娘だな」</p></div>
   <div class="say"><div class="f" style="background-image:url(${face('zara')})"></div><p>「去年は、火矢で砦ごと焼かれた。<b>だが、同じ手は二度と食わん</b>」</p></div>
   <p class="note">密偵の報告：ザラは<b>突き</b>に弱い。もうひとつ弱点があるらしいが、分からない。<br>去年の戦いで<b>炎</b>に崩されてから、炎への備えをしている（宿敵は、やられた戦い方を覚えます）。</p>
   <p class="note">遊び方：子をタップ → 青いマスへ動かす → 攻撃か技を選んで、赤いマスの敵をタップ。<br>敵の頭の上の札が、次に狙う相手です。味方の赤い数字は、そのまま受けると減るHP。<br>弱点を突くと盾が割れ、盾が0になると<b>ブレイク</b>。</p>
   <button class="big" id="go">戦いを始める</button>`,()=>{ $('go').onclick=()=>{closeModal();say('<b>ターン1</b>　子をタップして動かし、攻撃する。全員が動いたら、敵の番です。')} });
}
intro();
</script>
