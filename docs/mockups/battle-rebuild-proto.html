<title>新しい戦いの試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 戦いの盤が主役。上に今の状況、下に「次にできること」だけを出す一列の作り。教官の机×軍記ものの、夜の作戦卓の色 */
:root{
  --bg:#17120d; --panel:#241b13; --panel2:#2e2318; --line:#5a4632; --fg:#f2e6d0; --mute:#b8a68a;
  --gold:#e0b44c; --me:#4f86d6; --foe:#c44a3a; --move:#3d6fb8; --atk:#c0453a; --heal:#4fa36a; --danger:#d0503f;
  --plain:#4a5a36; --forest:#2f4425; --rock:#5d5348;
  --disp:"Shippori Mincho B1","Hiragino Mincho ProN",serif; --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.5;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px 40px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-family:var(--disp);font-size:18px;margin:0;font-weight:800;flex:1;min-width:0}
.pill{background:var(--gold);color:#2a1d0c;font-weight:700;border-radius:8px;padding:2px 10px;font-size:13px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700;padding:4px 6px;cursor:pointer}
.btn.on{background:#5b2a22;border-color:var(--danger)}
.btn.main{background:#8a2a1f;border-color:#c0533f;font-size:15px}
.btn.gold{background:#5a4410;border-color:var(--gold)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:64px;display:flex;gap:10px;align-items:center}
.info .ph{width:48px;height:48px;border-radius:8px;flex:none;background:var(--panel2);display:grid;place-items:center;font-family:var(--disp);font-size:22px;overflow:hidden}
.info .ph img{width:100%;height:100%;object-fit:cover}
.info .tx{min-width:0;flex:1}
.info b{font-size:15px}
.bar{height:6px;border-radius:3px;background:#3a2c20;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:#5fae5a}
.tags{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.t{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:4px;font-weight:700;font-size:12px;color:#fff}
.t.slash{background:#6c7a8a}.t.thrust{background:#3d6fb8}.t.crush{background:#8a5a2b}.t.shot{background:#4f8f3d}.t.fire{background:#c4532e}.t.thunder{background:#c9a21c;color:#2a1d0c}.t.ice{background:#3fa7c4}.t.light{background:#d9c66a;color:#2a1d0c}.t.dark{background:#6b4a8f}.t.q{background:#3a3027;border:1px dashed var(--mute)}
.chip{border:1px solid var(--mute);border-radius:999px;padding:0 8px;font-size:12px;color:var(--mute)}
.boardwrap{position:relative}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#0e0a07;border:2px solid #6d5434;border-radius:10px;padding:2px;touch-action:manipulation}
.cell{aspect-ratio:1;border-radius:4px;position:relative;background:var(--plain)}
.cell.f{background:var(--forest)}
.cell.f::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4c7a3d 0 30%,transparent 31%),radial-gradient(circle at 68% 40%,#4c7a3d 0 28%,transparent 29%),radial-gradient(circle at 50% 72%,#4c7a3d 0 28%,transparent 29%)}
.cell.r{background:var(--rock)}
.cell.r::after{content:"";position:absolute;left:28%;right:28%;bottom:26%;top:34%;background:#8a7c6a;clip-path:polygon(50% 0,100% 100%,0 100%)}
.cell.mv{box-shadow:inset 0 0 0 2px #8fb7f0;background-color:var(--move)}
.cell.f.mv{background-color:#2f5a8a}
.cell.at{box-shadow:inset 0 0 0 2px #f08b7f;background-color:#6a2a22}
.cell.hl{box-shadow:inset 0 0 0 2px #9fe0a8;background-color:#2c5a38}
.cell.dz::before{content:"";position:absolute;inset:0;border-radius:4px;background:rgba(208,80,63,.32);box-shadow:inset 0 0 0 1px rgba(240,120,100,.6)}
.cell.path{box-shadow:inset 0 0 0 3px var(--gold)}
.unit{position:absolute;top:0;left:0;border-radius:7px;display:grid;place-items:center;transition:transform var(--walk,.12s) linear,opacity .3s,filter .3s;pointer-events:none;will-change:transform}
.unit .card{width:88%;height:88%;border-radius:7px;overflow:hidden;position:relative;display:grid;place-items:center;font-family:var(--disp);font-weight:800}
.unit.me .card{border:2px solid var(--me);background:#f6ecd8;color:#2a1d0c}
.unit.foe .card{border:2px solid var(--foe);background:#3a1612;color:#f4d6c8;font-size:16px}
.unit.foe .card>span{position:absolute;top:14%;left:0;right:0;text-align:center;line-height:1}
.unit.boss .card{border-color:var(--gold);background:#3a1612}
.unit img{width:100%;height:100%;object-fit:cover}
.unit .hp{position:absolute;left:6%;right:6%;bottom:2%;height:4px;background:#000a;border-radius:2px;overflow:hidden}
.unit .hp i{display:block;height:100%;background:#5fae5a}
.unit.foe .hp i{background:#e0503f}
.unit .sh{position:absolute;top:4%;left:0;right:0;display:flex;justify-content:center;gap:1px}
.unit .sh i{width:7px;height:8px;background:#7fb2ff;clip-path:polygon(50% 0,100% 20%,85% 80%,50% 100%,15% 80%,0 20%)}
.unit .wk{position:absolute;bottom:9%;left:0;right:0;display:flex;justify-content:center;gap:1px}
.unit .wk .t{min-width:13px;height:13px;font-size:9px;padding:0 1px;border-radius:3px}
.unit.done{filter:grayscale(.85) brightness(.65)}
.unit.sel .card{box-shadow:0 0 0 3px var(--gold)}
.unit.focus .card{box-shadow:0 0 0 3px #fff,0 0 14px 4px #ffd36b}
.unit.broken .card::after{content:"崩";position:absolute;inset:0;display:grid;place-items:center;background:rgba(40,0,0,.55);color:#ffd36b;font-size:16px}
.unit.dead{opacity:0}
.unit.ghost{opacity:.35}
.badge{position:absolute;top:-8px;right:-6px;background:#c0392b;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:0 4px;line-height:16px}
.badge.lethal{background:#000;border:1px solid #ff6a55}
.pop{position:absolute;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;animation:pop .9s ease-out forwards;z-index:5}
.pop.sh{color:#9cc8ff;font-size:14px}.pop.h{color:#8ff0a0}
@keyframes pop{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}
.lunge{animation:lunge .26s ease-out}
.line{position:absolute;left:8px;right:8px;bottom:6px;z-index:6;background:rgba(20,14,9,.88);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;pointer-events:none}
.duel{position:absolute;inset:20% 4%;z-index:7;background:linear-gradient(90deg,#1c2a44 0 50%,#3a1612 50% 100%);border:2px solid var(--gold);border-radius:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px;gap:6px;pointer-events:none}
.duel .side{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.duel .face{width:72px;height:72px;border-radius:10px;overflow:hidden;background:#f6ecd8;display:grid;place-items:center;font-family:var(--disp);font-size:30px;color:#2a1d0c}
.duel .face img{width:100%;height:100%;object-fit:cover}
.duel .mid{font-family:var(--disp);font-size:26px;color:#fff;text-align:center;text-shadow:0 2px 0 #000}
.duel .mid small{display:block;font-size:13px;color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hint{color:var(--mute);font-size:13px;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tc{min-height:44px;text-align:left;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:8px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.tc.best{border-color:var(--gold)}
.tc .nm{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tc .dm{font-size:20px;font-weight:800}
.tc .dm small{font-size:12px;color:var(--mute);font-weight:500}
.tc .ef{display:flex;flex-wrap:wrap;gap:4px;font-size:11px}
.tc .ef span{background:#1a130d;border-radius:4px;padding:0 4px}
.tc .ef .w{color:#ffd36b}.tc .ef .k{color:#ff8a7a}.tc .ef .q{color:var(--mute)}
.tc:disabled{opacity:.35}
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:13px}
.fc .who{display:flex;gap:6px;align-items:center;min-width:0}
.fc .who .mini{width:32px;height:32px;border-radius:6px;overflow:hidden;flex:none;background:#f6ecd8;color:#2a1d0c;display:grid;place-items:center;font-family:var(--disp)}
.fc .who .mini img{width:100%;height:100%;object-fit:cover}
.after{font-size:12px;color:var(--mute)}
.after b{color:#ff8a7a}
.modal{position:absolute;inset:0;z-index:9;background:rgba(10,7,4,.72);display:flex;align-items:flex-start;justify-content:center;padding-top:30px}
.sheet{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:12px;width:min(400px,94%);display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto}
.sheet h3{font-family:var(--disp);margin:0;font-size:16px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}
.stat div{background:var(--panel2);border-radius:6px;padding:2px 6px;display:flex;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:4px 6px;font-size:12px;min-height:44px}
.li .mini{width:36px;height:36px;border-radius:6px;overflow:hidden;background:#f6ecd8;color:#2a1d0c;display:grid;place-items:center;font-family:var(--disp)}
.li.foe .mini{background:#3a1612;color:#f4d6c8}
.li .mini img{width:100%;height:100%;object-fit:cover}
.li.done{opacity:.55}
.banner{font-family:var(--disp);font-size:26px;text-align:center;color:var(--gold)}
.small{font-size:12px;color:var(--mute)}
.set{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@keyframes lunge{50%{translate:var(--lx,0) var(--ly,0)}}
@media (prefers-reduced-motion:reduce){.unit{transition:none}.pop{animation-duration:.01s}}
</style>

<div class="wrap" id="app">
  <div class="top"><h1 id="title">盗賊退治：見張り小屋</h1><span class="pill" id="turn">ターン1</span></div>
  <div class="tools">
    <button class="btn" id="bDanger" aria-pressed="false">危険範囲</button>
    <button class="btn" id="bList">一覧</button>
    <button class="btn" id="bNext">次の子へ</button>
    <button class="btn" id="bSet">設定</button>
  </div>
  <div class="info" id="info"></div>
  <div class="boardwrap" id="bw"><div class="board" id="board"></div></div>
  <div class="panel" id="panel"></div>
  <p class="small">試作です。1つの戦場だけ動きます。マスや駒を長押しすると、くわしい説明が出ます。閉じても、その番から続けられます。</p>
</div>

const U=id=>G.units.find(u=>u.id===id);
const alive=u=>u.hp>0;
const at=(x,y)=>G.units.find(u=>alive(u)&&u.x===x&&u.y===y);
const md=(a,b,c,d)=>Math.abs(a-c)+Math.abs(b-d);
const forest=(x,y)=>terr(x,y)==='f';
const isMagic=t=>t&&MAGIC.has(t.type);

/* 動ける場所（味方は通り抜けられる・敵は通れない・森は2歩） */
function reach(u){
  const best={}; const k=(x,y)=>x+','+y; best[k(u.x,u.y)]={c:0,p:null,x:u.x,y:u.y};
  const q=[[u.x,u.y]];
  while(q.length){const [x,y]=q.shift(); const cur=best[k(x,y)];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H)continue; const t=terr(nx,ny); if(t==='r')continue;
      const o=at(nx,ny); if(o&&o.side!==u.side)continue; const c=cur.c+(t==='f'?2:1); if(c>u.mov)continue;
      if(!best[k(nx,ny)]||best[k(nx,ny)].c>c){best[k(nx,ny)]={c,p:k(x,y),x:nx,y:ny}; q.push([nx,ny]);}}}
  for(const key in best){const b=best[key]; const o=at(b.x,b.y); if(o&&o!==u)b.stop=false; else b.stop=true;}
  return best;
}
function reachFrom(u,f){if(!f)return reach(u); const ox=u.x,oy=u.y; u.x=f.x;u.y=f.y; const r=reach(u); u.x=ox;u.y=oy; return r}
function pathTo(r,x,y){const out=[]; let k=x+','+y; while(k){const b=r[k]; out.unshift({x:b.x,y:b.y}); k=b.p;} return out;}
const atkTechs=u=>u.techs.filter(t=>t.type&&!t.heal&&t.uses>0);
function rangeOf(u){let a=9,b=0; for(const t of atkTechs(u)){a=Math.min(a,t.range[0]);b=Math.max(b,t.range[1])} return b?[a,b]:null}
/* その敵に届くか・どの技が届くか（場所 x,y から） */
function techsFrom(u,x,y,d){return atkTechs(u).filter(t=>{const m=md(x,y,d.x,d.y);return m>=t.range[0]&&m<=t.range[1]})}
/* 傷の計算（運なし） */
function calc(a,t,d,ax,ay){
  const mag=isMagic(t); const fb=forest(d.x,d.y)?2:0;
  const base=Math.max(1,a.pow+t.pow-((mag?d.res:d.def)+fb));
  const mul=d.broken>0?2:1; const per=base*mul; const total=per*t.hits;
  const weak=d.side==='foe'&&d.weak&&d.weak.includes(t.type);
  let sh=d.sh||0; let shLoss=0, brk=false;
  if(d.side==='foe'){ if(weak&&sh>0){shLoss=1} if(t.smash&&sh-shLoss>0)shLoss++; if(sh>0&&sh-shLoss<=0)brk=true; }
  let kill=d.hp-total<=0; let grit=false; if(kill&&d.grit&&!(d.broken>0)&&!brk){kill=false;grit=true}
  return {per,total,hits:t.hits,weak,known:weak&&d.known.includes(t.type),shLoss,brk,kill,grit,left:Math.max(grit?1:0,d.hp-total)};
}
/* 敵の狙い（その番の敵の動きの予定） */
function enemyPlan(e){
  if(e.broken>0) return {stay:true,broken:true};
  const r=reach(e); const mine=G.units.filter(u=>u.side==='me'&&alive(u)); if(!mine.length)return {stay:true};
  let best=null;
  for(const key in r){const s=r[key]; if(!s.stop)continue;
    for(const d of mine){const ts=techsFrom(e,s.x,s.y,d); for(const t of ts){const c=calc(e,t,d,s.x,s.y);
      const score=c.total+(c.kill?40:0)+(d.teacher?6:0)+(forest(s.x,s.y)?1:0)-s.c*0.1;
      if(!best||score>best.score)best={score,x:s.x,y:s.y,d:d.id,t:t.id,dmg:c.total,kill:c.kill};}}}
  if(e.guard&&best){const nd=Math.min(...mine.map(d=>md(e.x,e.y,d.x,d.y))); if(nd>e.guard&&!e.woke)return {stay:true}; }
  if(best) return best;
  if(e.guard&&!e.woke) return {stay:true};
  // 届かなければ近づく
  let tgt=null,dist=99; for(const d of mine){const m=md(e.x,e.y,d.x,d.y); if(m<dist){dist=m;tgt=d}}
  let go=null,gd=99; for(const key in r){const s=r[key]; if(!s.stop)continue; const m=md(s.x,s.y,tgt.x,tgt.y); if(m<gd||(m===gd&&forest(s.x,s.y))){gd=m;go=s}}
  return {x:go.x,y:go.y,adv:true};
}
function plan(){for(const e of G.units)if(e.side==='foe'&&alive(e))e.plan=enemyPlan(e);}
function threat(e){const r=reach(e); const set=new Set(); const rg=rangeOf(e); if(!rg)return set; for(const k in r){const s=r[k]; if(!s.stop)continue; for(let y=0;y<H;y++)for(let x=0;x<W;x++){const m=md(s.x,s.y,x,y); if(m>=rg[0]&&m<=rg[1])set.add(x+','+y)}} return set;}

function buildBoard(){
  board.innerHTML=''; cells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('div'); c.className='cell '+terr(x,y); c.dataset.x=x; c.dataset.y=y; c.setAttribute('role','button'); c.tabIndex=-1; board.appendChild(c); cells.push(c);}
  unitEls={};
  for(const u of G.units){const el=document.createElement('div'); el.className='unit '+u.side+(u.boss?' boss':''); el.innerHTML='<div class="card"></div>'; board.appendChild(el); unitEls[u.id]=el;}
  measure();
}
function measure(){const c=cells[0]; if(!c)return; cs=c.offsetWidth+2; for(const u of G.units){const el=unitEls[u.id]; el.style.width=c.offsetWidth+'px'; el.style.height=c.offsetWidth+'px';} place(true);}
function face(u,cls){ if(u.face&&FACES[u.face]) return `<img src="${FACES[u.face]}" alt="">`; return `<span>${u.mark||'?'}</span>`; }
function tchip(t,known=true){return known?`<span class="t ${t}">${TN[t]}</span>`:`<span class="t q">？</span>`}
function place(instant){
  for(const u of G.units){const el=unitEls[u.id]; if(!el)continue;
    const x=u.x,y=u.y;
    if(instant)el.style.transition='none';
    el.style.transform=`translate(${2+x*cs}px,${2+y*cs}px)`;
    if(instant){void el.offsetWidth; el.style.transition='';}
    el.classList.toggle('dead',!alive(u)); el.classList.toggle('done',!!u.done&&u.side==='me');
    el.classList.toggle('sel',ui.sel===u.id); el.classList.toggle('focus',ui.focus===u.id); el.classList.toggle('broken',u.broken>0);
    const card=el.querySelector('.card');
    let h=face(u)+`<div class="hp"><i style="width:${100*u.hp/u.max}%"></i></div>`;
    if(u.side==='foe'){ h+=`<div class="sh">${'<i></i>'.repeat(u.sh||0)}</div>`; h+=`<div class="wk">${u.weak.map(w=>u.known.includes(w)?tchip(w):tchip(w,false)).join('')}</div>`; }
    card.innerHTML=h;
    // 狙われている子に赤い数字
    let b=el.querySelector('.badge'); if(b)b.remove();
    if(u.side==='me'&&alive(u)&&G.phase==='me'){let sum=0,lethal=false; for(const e of G.units)if(e.side==='foe'&&alive(e)&&e.plan&&e.plan.d===u.id){sum+=e.plan.dmg}
      if(sum){lethal=sum>=u.hp; const s=document.createElement('span'); s.className='badge'+(lethal?' lethal':''); s.textContent=(lethal?'危 ':'')+'−'+sum; el.appendChild(s);} }
  }
}
function paintCells(){
  const sel=ui.sel&&U(ui.sel);
  let mv=new Set(), atk=new Set(), hl=new Set(), dz=new Set();
  if(ui.danger||(ui.info&&U(ui.info)?.side==='foe'&&ui.mode==='idle')){
    const list=ui.danger?G.units.filter(e=>e.side==='foe'&&alive(e)):[U(ui.info)];
    for(const e of list)for(const k of threat(e))dz.add(k);
  }
  if(sel&&ui.mode==='move'){const r=reach(sel); for(const k in r)if(r[k].stop)mv.add(k);
    const rg=rangeOf(sel); if(rg)for(const k in r){if(!r[k].stop)continue; const s=r[k]; for(const e of G.units)if(e.side==='foe'&&alive(e)){const m=md(s.x,s.y,e.x,e.y); if(atkTechs(sel).some(t=>m>=t.range[0]&&m<=t.range[1]))atk.add(e.x+','+e.y)}}
    const ht=sel.techs.find(t=>t.heal&&t.uses>0); if(ht)for(const k in r){if(!r[k].stop)continue; const s=r[k]; for(const a of G.units)if(a.side==='me'&&alive(a)&&a!==sel&&a.hp<a.max){const m=md(s.x,s.y,a.x,a.y); if(m>=ht.range[0]&&m<=ht.range[1])hl.add(a.x+','+a.y)}}
  }
  if(sel&&(ui.mode==='act'||ui.mode==='fore')){ ui.dest={x:sel.x,y:sel.y};
    for(const e of G.units)if(e.side==='foe'&&alive(e)&&techsFrom(sel,sel.x,sel.y,e).length)atk.add(e.x+','+e.y);
    const ht=sel.techs.find(t=>t.heal&&t.uses>0); if(ht)for(const a of G.units)if(a.side==='me'&&alive(a)&&a!==sel&&a.hp<a.max){const m=md(sel.x,sel.y,a.x,a.y); if(m>=ht.range[0]&&m<=ht.range[1])hl.add(a.x+','+a.y)}
  }
  if(ui.mode==='cmd'&&sel){for(const a of G.units)if(a.side==='me'&&alive(a)&&a.done&&!a.teacher&&md(a.x,a.y,sel.x,sel.y)===1)hl.add(a.x+','+a.y)}
  cells.forEach(c=>{const k=c.dataset.x+','+c.dataset.y; c.classList.toggle('mv',mv.has(k)); c.classList.toggle('at',atk.has(k)); c.classList.toggle('hl',hl.has(k)); c.classList.toggle('dz',dz.has(k)); c.classList.toggle('path',!!(ui.dest&&ui.mode!=='idle'&&ui.mode!=='move'&&+c.dataset.x===ui.dest.x&&+c.dataset.y===ui.dest.y));});
}

    const d=U(ui.tgt); const heal=d.side==='me';
    if(heal){const t=sel.techs.find(t=>t.heal&&t.uses>0); const amt=Math.min(t.heal,d.max-d.hp);
      p.innerHTML=`<div class="fc"><div class="who"><div class="mini">${face(sel)}</div><b>${sel.name}</b></div><div>→</div><div class="who"><div class="mini">${face(d)}</div><b>${d.name}</b></div></div><div class="cards"><button class="tc best" id="c0"><span class="nm">${t.name}${tchip('light')}</span><span class="dm">+${amt}<small> 体力 ${d.hp}→${d.hp+amt}</small></span><span class="ef"><span>のこり${t.uses}</span></span></button></div><div class="row"><button class="btn" id="pBack">ほかを選ぶ</button><button class="btn" id="pWait">待機</button></div>`;
      $('#c0').onclick=()=>doHeal(t,d); $('#pBack').onclick=()=>{ui.mode='act';ui.tgt=null;render()}; $('#pWait').onclick=wait; return}
    const ts=techsFrom(sel,sel.x,sel.y,d);
    const res=ts.map(t=>({t,c:calc(sel,t,d)}));
    let bi=0; res.forEach((r,i)=>{const sc=(r.c.kill?100:0)+(r.c.known?20:0)+(r.c.brk&&r.c.known?30:0)+r.c.total; const sb=(res[bi].c.kill?100:0)+(res[bi].c.known?20:0)+(res[bi].c.brk&&res[bi].c.known?30:0)+res[bi].c.total; if(sc>sb)bi=i});
    // このあと狙われるか（その場所に立ったとき）
    const after=dangerAt(sel,sel.x,sel.y);
    p.innerHTML=`<div class="fc"><div class="who"><div class="mini">${face(sel)}</div><div><b>${sel.name}</b><div class="small">体力 ${sel.hp}/${sel.max}${forest(sel.x,sel.y)?'・森':''}</div></div></div><div>→</div><div class="who"><div class="mini">${face(d)}</div><div><b>${d.name}</b><div class="small">体力 ${d.hp}・盾 ${d.sh}${forest(d.x,d.y)?'・森':''}</div></div></div></div>
    <div class="cards">${res.map((r,i)=>{const c=r.c; const ef=[]; if(c.kill)ef.push('<span class="k">倒せる</span>'); else ef.push(`<span>のこり体力 ${c.left}</span>`); if(c.grit)ef.push('<span class="k">執念で1残る</span>'); if(c.weak&&c.known)ef.push(`<span class="w">弱点！盾−${c.shLoss}</span>`); else if(c.weak)ef.push('<span class="q">効き目は？</span>'); else if(c.shLoss)ef.push(`<span>盾−${c.shLoss}</span>`); if(c.brk&&(c.known||!c.weak))ef.push('<span class="w">ブレイク！</span>'); if(r.t.max<99)ef.push(`<span>のこり${r.t.uses}</span>`);
      return `<button class="tc ${i===bi?'best':''}" data-i="${i}"><span class="nm">${r.t.name}${tchip(r.t.type)}</span><span class="dm">${c.total}<small>${c.hits>1?` (${c.per}×${c.hits})`:''}</small></span><span class="ef">${ef.join('')}</span></button>`}).join('')}</div>
    <p class="after">反撃はありません。${after.n?`この場所は、敵の番に<b>${after.n}人から狙われる見込み（−${after.dmg}${after.dmg>=sel.hp?'・倒れる':''}）</b>`:'この場所は、敵の番に狙われる見込みはありません'}。</p>
    <div class="row"><button class="btn" id="pBack">ほかを選ぶ</button><button class="btn" id="pWait">待機</button></div>`;
    p.querySelectorAll('.tc').forEach(b=>b.onclick=()=>doAttack(res[+b.dataset.i].t,d));
    $('#pBack').onclick=()=>{ui.mode='act';ui.tgt=null;render()}; $('#pWait').onclick=wait; return}
}
function bindFoot(){$('#pEnd').onclick=()=>{if(G.units.some(u=>u.side==='me'&&alive(u)&&!u.done)){ui.confirm=true;render()}else endTurn()}; $('#pUndo').onclick=doUndo;}
function dangerAt(u,x,y){const ox=u.x,oy=u.y; u.x=x;u.y=y; let n=0,dmg=0; for(const e of G.units)if(e.side==='foe'&&alive(e)){const p=enemyPlan(e); if(p.d===u.id){n++;dmg+=p.dmg}} u.x=ox;u.y=oy; return {n,dmg};}
function render(){place(false);paintCells();infoBox();panel();$('#turn').textContent='ターン'+G.turn;$('#bDanger').classList.toggle('on',ui.danger);$('#bDanger').setAttribute('aria-pressed',ui.danger);}

/* ===== 操作 ===== */
function doUndo(){if(!undo.length||ui.anim)return; G=JSON.parse(undo.pop()); ui.mode='idle';ui.sel=null;ui.dest=null;ui.tgt=null;ui.pre=null;ui.from=null; buildBoard(); plan(); render(); save();}
function cancel(){ui.mode='idle';ui.sel=null;ui.dest=null;ui.tgt=null;render();}
function select(u){ui.sel=u.id;ui.info=u.id;ui.mode='move';ui.dest=null;ui.from=null;render();}
function finish(u){u.done=true; if(ui.pre){undo.push(ui.pre); if(undo.length>30)undo.shift(); ui.pre=null} ui.mode='idle';ui.sel=null;ui.dest=null;ui.tgt=null;ui.from=null; plan(); check(); save(); render(); autoNext();}
function wait(){finish(U(ui.sel));}
function back(){const u=U(ui.sel); if(ui.from){u.x=ui.from.x;u.y=ui.from.y} ui.from=null; ui.pre=null; ui.mode='move'; ui.tgt=null; place(true); render();}
/* 青いマスへ歩いてから、次にできることを出す（FEと同じ） */
async function beginMove(x,y,after){const u=U(ui.sel); const r=reachFrom(u,ui.from); if(!ui.from){ui.from={x:u.x,y:u.y}; ui.pre=JSON.stringify(G);} else {u.x=ui.from.x;u.y=ui.from.y; place(true);}
  const path=pathTo(r,x,y); ui.anim=true; ui.mode='anim'; paintCells(); unitEls[u.id].style.setProperty('--walk','.09s'); await walk(u,path,90); ui.anim=false; after();}
function bestTileFor(u,d){const r=reachFrom(u,ui.from); let best=null; for(const k in r){const s=r[k]; if(!s.stop&&!(s.x===u.x&&s.y===u.y))continue; const ts=techsFrom(u,s.x,s.y,d); if(!ts.length)continue; const dg=dangerAt(u,s.x,s.y); const sc=-dg.dmg*2+(forest(s.x,s.y)?3:0)-s.c*0.3; if(!best||sc>best.sc)best={sc,x:s.x,y:s.y}} return best;}
function tapCell(x,y){
  if(G.phase!=='me'||G.over||ui.anim)return;
  const o=at(x,y); const sel=U(ui.sel||'');
  if(ui.mode==='idle'){ if(o&&o.side==='me'&&!o.done){select(o);return} ui.info=o?o.id:null; render(); return}
  if(ui.mode==='move'){
    if(o&&o.side==='foe'){const t=bestTileFor(sel,o); if(t){ui.info=o.id; beginMove(t.x,t.y,()=>{ui.tgt=o.id;ui.mode='fore';render()});} else {ui.info=o.id;render()} return}
    const ht=sel.techs.find(t=>t.heal&&t.uses>0);
    if(o&&o.side==='me'&&o!==sel&&ht&&o.hp<o.max){const r=reach(sel); let best=null; for(const k in r){const s=r[k]; if(!s.stop)continue; const m=md(s.x,s.y,o.x,o.y); if(m>=ht.range[0]&&m<=ht.range[1]){const sc=-dangerAt(sel,s.x,s.y).dmg-s.c*0.3; if(!best||sc>best.sc)best={sc,x:s.x,y:s.y}}} if(best){beginMove(best.x,best.y,()=>{ui.tgt=o.id;ui.mode='fore';render()});return}}
    const r=reach(sel); const s=r[x+','+y]; if(s&&s.stop){beginMove(x,y,()=>{ui.mode='act';render()});return}
    if(o&&o.side==='me'&&!o.done){select(o);return}
    cancel(); return}
  if(ui.mode==='act'||ui.mode==='fore'){
    if(o&&o.side==='foe'&&techsFrom(sel,sel.x,sel.y,o).length){ui.tgt=o.id;ui.info=o.id;ui.mode='fore';render();return}
    const ht=sel.techs.find(t=>t.heal&&t.uses>0); if(o&&o.side==='me'&&ht&&o!==sel&&o.hp<o.max&&md(sel.x,sel.y,o.x,o.y)>=ht.range[0]&&md(sel.x,sel.y,o.x,o.y)<=ht.range[1]){ui.tgt=o.id;ui.mode='fore';render();return}
    if(o&&o.side==='foe'){const t=bestTileFor(sel,o); if(t){ui.info=o.id; beginMove(t.x,t.y,()=>{ui.tgt=o.id;ui.mode='fore';render()});} return}
    const r=reachFrom(sel,ui.from); const s=r[x+','+y]; if((s&&s.stop)||(ui.from&&x===ui.from.x&&y===ui.from.y)){beginMove(x,y,()=>{ui.mode='act';ui.tgt=null;render()});return}
    return}
  if(ui.mode==='cmd'){if(o&&o.side==='me'&&o.done&&!o.teacher&&md(o.x,o.y,sel.x,sel.y)===1){sel.techs.find(t=>t.special==='cmd').uses--; o.done=false; flashLine(`号令：${o.name}がもう一度動ける`); finish(sel); select(o);} return}
}
async function walk(u,path,step){ for(const c of path.slice(1)){u.x=c.x;u.y=c.y; place(false); await sleep(step);} }
function sleep(ms){return new Promise(r=>setTimeout(r,ms/((fast||skipAll)?6:1)/SET.speed))}
let fast=false, skipAll=false;
async function doAttack(t,d){const u=U(ui.sel); ui.anim=true; ui.mode='anim'; paintCells(); panel(); await strike(u,t,d); if(t.max<99)t.uses--; ui.anim=false; finish(u);}
async function doHeal(t,d){const u=U(ui.sel); ui.anim=true; ui.mode='anim'; paintCells(); panel(); const amt=Math.min(t.heal,d.max-d.hp); d.hp+=amt; t.uses--; pop(d,'+'+amt,'h'); flashLine(`${u.name}：${d.name}を癒した（+${amt}）`); await sleep(500); ui.anim=false; finish(u);}
async function strike(a,t,d){
  const c=calc(a,t,d);
  const el=unitEls[a.id]; el.style.setProperty('--lx',Math.sign(d.x-a.x)*cs*0.3+'px'); el.style.setProperty('--ly',Math.sign(d.y-a.y)*cs*0.3+'px'); el.classList.remove('lunge'); void el.offsetWidth; el.classList.add('lunge');
  if(SET.duel!=='off') await duel(a,d,t,c);
  d.hp=c.left; if(c.shLoss){d.sh=Math.max(0,d.sh-c.shLoss)} if(c.weak&&!d.known.includes(t.type))d.known.push(t.type); if(c.brk)d.broken=1; if(c.grit)d.grit=0;
  if(d.side==='foe'&&!d.woke)d.woke=1;
  pop(d,'−'+c.total,''); if(c.shLoss)setTimeout(()=>pop(d,'盾−'+c.shLoss,'sh'),150); if(c.weak)setTimeout(()=>pop(d,'弱点：'+TN[t.type],'sh'),300); if(c.brk)setTimeout(()=>pop(d,'ブレイク！','sh'),450); if(c.grit)setTimeout(()=>pop(d,'執念で耐えた','sh'),450);
  const txt=`${a.name}：${d.name}を${t.name!=='攻撃'&&t.name!=='剣'&&t.name!=='槍'&&t.name!=='斧'&&t.name!=='弓'?'「'+t.name+'」で':''}${VERB[t.type]}（−${c.total}${c.left<=0?'・倒れた':''}）`; flashLine(txt); G.log.push((G.phase==='foe'?'敵の番：':'')+txt);
  place(false); await sleep(520);
}
function duel(a,d,t,c){return new Promise(res=>{ if(skipAll){res();return}
  const o=document.createElement('div'); o.className='duel';
  o.innerHTML=`<div class="side"><div class="face">${face(a)}</div>${a.name}</div><div class="mid">−${c.total}<small>${t.name}${c.weak&&(c.known||c.brk)?'・弱点':''}${c.brk?'・ブレイク':''}</small></div><div class="side"><div class="face">${face(d)}</div>${d.name}</div>`;
  $('#bw').appendChild(o); setTimeout(()=>{o.remove();res()},(SET.duel==='full'?900:420)/((fast)?4:1)/SET.speed);})}
function pop(u,text,cls){const p=document.createElement('div'); p.className='pop '+cls; p.textContent=text; p.style.left=(4+u.x*cs)+'px'; p.style.top=(u.y*cs)+'px'; board.appendChild(p); setTimeout(()=>p.remove(),950);}
let lineT; function flashLine(t){let l=$('#bw .line'); if(!l){l=document.createElement('div');l.className='line';$('#bw').appendChild(l)} l.textContent=t; clearTimeout(lineT); lineT=setTimeout(()=>l.remove(),2200);}
function check(){const boss=U('b'); if(!alive(boss)||G.units.every(e=>e.side!=='foe'||!alive(e)))G.over='win'; if(!alive(U('tc')))G.over='lose'; if(G.over){try{localStorage.removeItem('proto5')}catch(e){}}}
function autoNext(){ if(G.over||G.phase!=='me')return; const n=G.units.filter(u=>u.side==='me'&&alive(u)&&!u.done); if(!n.length){render(); flashLine('全員が動き終えました。「番を終える」で敵の番へ');} }
function nextUnit(){ if(G.phase!=='me'||ui.anim)return; const list=G.units.filter(u=>u.side==='me'&&alive(u)&&!u.done); if(!list.length)return; const i=list.findIndex(u=>u.id===ui.sel); const n=list[(i+1)%list.length]; select(n); unitEls[n.id].scrollIntoView({block:'nearest',behavior:'smooth'}); }

async function endTurn(){
  ui.mode='idle';ui.sel=null;ui.dest=null;ui.info=null; G.phase='foe'; skipAll=false; render();
  const order=G.units.filter(e=>e.side==='foe'&&alive(e)).sort((a,b)=>(a.boss?1:0)-(b.boss?1:0)||a.y-b.y||a.x-b.x);
  for(const e of order){ if(!alive(e)||G.over)continue;
    if(e.broken>0){e.broken=0; e.sh=e.msh; ui.focus=e.id; place(false); flashLine(`${e.name}：崩れて動けない（次の番から立て直す）`); await sleep(500); ui.focus=null; place(false); continue;}
    const p=enemyPlan(e); ui.focus=e.id; ui.info=e.id; infoBox(); place(false); flashLine(`${e.name}の番`);
    const grunt=!e.boss; await sleep(grunt?260:520);
    if(p.stay){flashLine(`${e.name}：待ち構えている`); await sleep(grunt?200:400); ui.focus=null; place(false); continue;}
    const path=pathTo(reach(e),p.x,p.y); const step=grunt?90:140; unitEls[e.id].style.setProperty('--walk',(step/1000/((fast||skipAll)?6:1)/SET.speed)+'s'); await walk(e,path,step);
    if(p.d){const d=U(p.d); if(alive(d)){const t=e.techs.find(t=>t.id===p.t); await strike(e,t,d); check();}} else {flashLine(`${e.name}：前へ進んだ`); await sleep(200);}
    ui.focus=null; place(false); await sleep(grunt?120:260);
  }
  if(!G.over){G.turn++; G.phase='me'; for(const u of G.units)if(u.side==='me')u.done=false; U('tc').techs.find(t=>t.special==='cmd').uses=1; undo=[]; plan(); flashLine('ターン'+G.turn+'：こちらの番');}
  ui.info=null; save(); render();
}

/* 長押しの説明 */
function longInfo(x,y){const o=at(x,y); const m=document.createElement('div'); m.className='modal';
  let h=`<div class="sheet"><h3>${tName[terr(x,y)]}</h3><div class="small">${tDesc[terr(x,y)]}</div>`;
  if(o){h+=`<h3>${o.name} <span class="small">${o.cls||''}</span></h3><div class="stat"><div>体力<b>${o.hp}/${o.max}</b></div><div>力<b>${o.pow}</b></div><div>守り<b>${o.def}</b></div><div>魔防<b>${o.res}</b></div><div>動き<b>${o.mov}</b></div>${o.side==='foe'?`<div>盾<b>${o.sh}/${o.msh}</b></div>`:''}</div>`;
    h+=`<div class="list">${o.techs.filter(t=>t.type||t.special).map(t=>`<div class="li"><div class="mini">${t.type?tchip(t.type):'号'}</div><div><b>${t.name}</b><div class="small">${t.heal?'体力+'+t.heal:'威力 '+(o.pow+t.pow)+(t.hits>1?'×'+t.hits:'')}・届く ${t.range[0]===t.range[1]?t.range[0]:t.range[0]+'〜'+t.range[1]}マス${t.smash?'・盾を1つ多く割る':''}${t.special==='cmd'?'隣の行動済みの子をもう一度動かす':''}</div></div><div class="small">${t.max<99?'のこり'+t.uses:''}</div></div>`).join('')}</div>`;
    if(o.side==='foe')h+=`<div class="small">弱点：${o.weak.map(w=>o.known.includes(w)?TN[w]:'？').join('・')}${o.grit?'　執念：一度だけ体力1で持ちこたえる':''}${o.guard?'　近づくまで待ち構える':''}</div>`;}
  h+=`<button class="btn" id="mClose">閉じる</button></div>`; m.innerHTML=h; $('#bw').appendChild(m); m.onclick=e=>{if(e.target===m||e.target.id==='mClose')m.remove()};}
/* 一覧 */
function listSheet(){const m=document.createElement('div'); m.className='modal'; const row=u=>`<div class="li ${u.side}${u.done?' done':''}"><div class="mini">${face(u)}</div><div><b>${u.name}</b> <span class="small">${u.cls||''}</span><div class="bar"><i style="width:${100*u.hp/u.max}%"></i></div><div class="small">${u.side==='me'?u.techs.filter(t=>t.max<99).map(t=>t.name+' '+t.uses).join('・')||'—':'盾'+u.sh+'・弱点 '+u.weak.map(w=>u.known.includes(w)?TN[w]:'？').join('')+(u.plan&&u.plan.d?'・狙い '+U(u.plan.d).name:'')}</div></div><div class="small">${u.hp}/${u.max}${u.side==='me'?'<br>'+(u.done?'済み':'まだ'):''}</div></div>`;
  m.innerHTML=`<div class="sheet"><h3>味方</h3><div class="list">${G.units.filter(u=>u.side==='me'&&alive(u)).map(row).join('')}</div><h3>敵</h3><div class="list">${G.units.filter(u=>u.side==='foe'&&alive(u)).map(row).join('')}</div><button class="btn" id="mClose">閉じる</button></div>`; $('#bw').appendChild(m); m.onclick=e=>{if(e.target===m||e.target.id==='mClose')m.remove()};}
function setSheet(){const m=document.createElement('div'); m.className='modal'; const opt=(k,v,l)=>`<button class="btn ${SET[k]===v?'gold':''}" data-k="${k}" data-v="${v}">${l}</button>`;
  m.innerHTML=`<div class="sheet"><h3>設定</h3><div class="small">敵の番の速さ</div><div class="set">${opt('speed',1,'ふつう')}${opt('speed',2,'はやい')}</div><div class="small">攻撃のたびの1対1の場面</div><div class="set">${opt('duel','short','短く')}${opt('duel','full','長く')}${opt('duel','off','出さない')}</div><button class="btn" id="mRe">最初からやり直す</button><button class="btn" id="mClose">閉じる</button></div>`;
  $('#bw').appendChild(m); m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v; SET[b.dataset.k]=isNaN(+v)?v:+v; try{localStorage.setItem('proto5set',JSON.stringify(SET))}catch(e){} m.remove(); setSheet();});
  m.onclick=e=>{if(e.target===m||e.target.id==='mClose')m.remove(); if(e.target.id==='mRe'){m.remove();try{localStorage.removeItem('proto5')}catch(er){} newGame();buildBoard();render();}};}

/* タップと長押し */
let pressT=null, longed=false;
board.addEventListener('pointerdown',e=>{ if(G.phase==='foe'){fast=true;return} const c=e.target.closest('.cell'); if(!c)return; longed=false; clearTimeout(pressT); pressT=setTimeout(()=>{longed=true; longInfo(+c.dataset.x,+c.dataset.y)},480);});
board.addEventListener('pointerup',e=>{fast=false; clearTimeout(pressT); if(longed||G.phase==='foe')return; const c=e.target.closest('.cell'); if(c)tapCell(+c.dataset.x,+c.dataset.y);});
board.addEventListener('pointerleave',()=>{fast=false;clearTimeout(pressT)});
board.addEventListener('pointercancel',()=>{fast=false;clearTimeout(pressT)});
board.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',e=>{if(G.phase==='foe'&&!e.target.closest('#pSkip'))fast=true}); document.addEventListener('pointerup',()=>{fast=false});
$('#bDanger').onclick=()=>{ui.danger=!ui.danger;render()};
$('#bList').onclick=listSheet; $('#bSet').onclick=setSheet; $('#bNext').onclick=nextUnit;
window.addEventListener('resize',measure);

if(!load())newGame();
buildBoard(); render();
if(G.turn===1&&G.units.every(u=>u.side!=='me'||!u.done))flashLine('教え子をタップして、青いマスへ動かそう');
</script>
